services:
  postgres:
    image: postgres:16-alpine
    container_name: daily-lens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dailylens
      POSTGRES_PASSWORD: dailylens_pw
      POSTGRES_DB: daily_lens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailylens -d daily_lens"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: daily-lens-keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak:/opt/keycloak/data/import

  backend:
    container_name: daily-lens-backend
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: dailylens
      DB_PASSWORD: dailylens_pw
      DB_DATABASE: daily_lens
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8080/realms/daily-lens
      PHOTO_URL_SIGNING_SECRET: daily-lens-secret
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    container_name: daily-lens-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  keycloak_data:
  backend_uploads:
