services:
  postgres:
    image: postgres:16-alpine
    container_name: daily-lens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dailylens
      POSTGRES_PASSWORD: dailylens_pw
      POSTGRES_DB: daily_lens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailylens -d daily_lens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
