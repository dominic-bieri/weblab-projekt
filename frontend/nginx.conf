server {
    listen 80;
    server_name localhost;

    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Textkompression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json image/svg+xml application/manifest+json;

    # Content-gehashte Build-Assets: dürfen dauerhaft gecacht werden
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # App-Shell: bei jedem Load neu validieren
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Leitet an den Backend-Container weiter, entfernt dabei das /api-Präfix
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
