<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DailyLens</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="DailyLens is a photo journal that turns a single photo a day into a visual diary, with calendar overview and daily photo challenges."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preload" href="i18n/en.json" as="fetch" />
    <!--  Keycloak  -->
    <link rel="preconnect" href="http://localhost:8080" />
    <style>
      /* Platzhalter bis Angular bootstrapped ist: wird von app-root's Template ersetzt.
         Wichtig, da keycloak.init() bei nicht erreichbarem Keycloak-Server bis zu ~20s
         braucht (zwei Iframe-Timeouts), bevor der Bootstrap-Promise sich aufloest. */
      .app-boot-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        height: 100vh;
        font-family: Roboto, Arial, sans-serif;
        color: var(--mat-sys-on-surface, #1a1a1a);
      }
      .app-boot-loader__spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 0.25rem solid var(--mat-sys-surface-variant, #d9d9d9);
        border-top-color: var(--mat-sys-primary, #6750a4);
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-boot-loader" role="status" aria-live="polite">
        <div class="app-boot-loader__spinner"></div>
        <p>Loading Daily Lens...</p>
      </div>
    </app-root>
  </body>
</html>
