<section class="login">
  <h1>{{ 'auth.title' | translate }}</h1>
  <p>{{ 'auth.tagline' | translate }}</p>

  <button mat-flat-button data-testid="login-button" (click)="login()">
    {{ 'auth.login' | translate }}
  </button>
  <button mat-stroked-button data-testid="register-button" (click)="register()">
    {{ 'auth.register' | translate }}
  </button>
</section>
