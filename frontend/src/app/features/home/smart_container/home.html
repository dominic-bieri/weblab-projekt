<ng-container>
  <app-streak-badge class="home-streak" [streak]="streak()" />

  <app-photo-upload [challenges]="challenges()" (submitted)="onPhotoUpload($event)" />

  @if (photos.hasValue()) {
    @for (photo of photos.value(); track photo.id) {
      <app-photo-card
        [id]="photo.id"
        [photoSource]="photoUrl(photo)"
        [captureDate]="photo.captureDate"
        [description]="photo.description"
        [challengeId]="photo.challengeId"
        [challenges]="challenges()"
        [priority]="$index === 0"
        (deleted)="onPhotoDelete($event)"
        (edited)="onPhotoEdit($event)"
      />
    }
  } @else if (photos.error()) {
    <p data-testid="home-photos-error">{{ 'common.loadError' | translate }}</p>
  }
</ng-container>
