<ng-container>
  <app-file-upload (submitted)="onPhotoUpload($event)" />

  @if (photos.hasValue()) {
    @for (photo of photos.value(); track photo.id) {
      <app-picture-card
        [imageSource]="imageUrl(photo)"
        [captureDate]="photo.captureDate"
        [description]="photo.description ?? ''"
      />
    }
  }
</ng-container>
