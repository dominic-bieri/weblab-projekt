<mat-card data-testid="photo-card">
  <mat-card-title data-testid="photo-card-date">
    {{ formattedCaptureDate() }}
  </mat-card-title>
  <img
    ngSrc="{{ photoSource() }}"
    mat-card-image
    data-testid="photo-card-image"
    width="500"
    height="400"
    [priority]="priority()"
    [alt]="description()"
  />
  <mat-card-content>
    <p data-testid="photo-card-description">{{ description() }}</p>
    @if (challengeName(); as name) {
      <p data-testid="photo-card-challenge">{{ name }}</p>
    }
  </mat-card-content>
  <div class="card-actions">
    <button
      mat-stroked-button
      type="button"
      data-testid="photo-card-edit-button"
      (click)="startEdit()"
    >
      <mat-icon>edit</mat-icon>
      {{ 'photoCard.edit' | translate }}
    </button>
    <button
      mat-stroked-button
      type="button"
      data-testid="photo-card-delete-button"
      (click)="onDelete()"
    >
      <mat-icon>delete</mat-icon>
      {{ 'photoCard.delete' | translate }}
    </button>
  </div>
</mat-card>
