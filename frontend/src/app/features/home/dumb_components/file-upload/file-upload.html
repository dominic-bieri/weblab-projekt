<form class="upload-form" (submit)="submitForm($event)">
  <input #fileInput type="file" hidden [accept]="accept()" (change)="onFileChange($event)" />

  <button mat-stroked-button type="button" (click)="fileInput.click()">
    <mat-icon>attach_file</mat-icon>
    {{ 'fileUpload.chooseFile' | translate }}
  </button>

  <span class="file-name">
    {{ uploadForm.file().value()?.name ?? ('fileUpload.noFileSelected' | translate) }}
  </span>

  <mat-form-field appearance="fill" subscriptSizing="dynamic">
    <mat-label>{{ 'fileUpload.captureDate' | translate }}</mat-label>
    <input matInput [matDatepicker]="capturePicker" [formField]="uploadForm.captureDate" />
    <mat-datepicker-toggle matIconSuffix [for]="capturePicker" />
    <mat-datepicker #capturePicker />
  </mat-form-field>

  <mat-form-field appearance="fill" subscriptSizing="dynamic">
    <mat-label>{{ 'fileUpload.description' | translate }}</mat-label>
    <input
      matInput
      type="text"
      [placeholder]="'fileUpload.descriptionPlaceholder' | translate"
      [formField]="uploadForm.description"
    />
  </mat-form-field>

  <button mat-flat-button type="submit" [disabled]="!uploadForm().valid()">
    {{ 'fileUpload.upload' | translate }}
  </button>
</form>
