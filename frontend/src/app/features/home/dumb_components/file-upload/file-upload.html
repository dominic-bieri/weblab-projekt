<form class="upload-form" (submit)="submitForm($event)">
  <input #fileInput type="file" hidden [accept]="accept()" (change)="onFileChange($event)" />

  <button mat-stroked-button type="button" (click)="fileInput.click()">
    <mat-icon>attach_file</mat-icon>
    Datei auswählen
  </button>

  <span class="file-name">
    {{ uploadForm.file().value()?.name ?? 'Keine Datei ausgewählt' }}
  </span>

  <label class="field">
    Aufnahmedatum
    <input
      type="date"
      [value]="uploadForm.captureDate().value()"
      (input)="uploadForm.captureDate().value.set($any($event.target).value)"
    />
  </label>

  <label class="field">
    Beschreibung
    <input
      type="text"
      placeholder="Beschreibung"
      [value]="uploadForm.description().value()"
      (input)="uploadForm.description().value.set($any($event.target).value)"
    />
  </label>

  <button mat-flat-button type="submit" [disabled]="!uploadForm().valid()">Upload</button>
</form>
