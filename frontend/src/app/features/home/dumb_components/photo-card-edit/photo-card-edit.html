<h2 mat-dialog-title>{{ 'photoCard.editTitle' | translate }}</h2>

<mat-dialog-content class="photo-card-edit__content">
  <mat-form-field appearance="fill" subscriptSizing="dynamic">
    <mat-label>{{ 'photoUpload.captureDate' | translate }}</mat-label>
    <input
      matInput
      data-testid="photo-card-date-input"
      [matDatepicker]="editDatePicker"
      [formField]="editForm.captureDate"
    />
    <mat-datepicker-toggle matIconSuffix [for]="editDatePicker" />
    <mat-datepicker #editDatePicker />
  </mat-form-field>

  <mat-form-field appearance="fill" subscriptSizing="dynamic">
    <mat-label>{{ 'photoUpload.description' | translate }}</mat-label>
    <input
      matInput
      type="text"
      data-testid="photo-card-description-input"
      [formField]="editForm.description"
    />
  </mat-form-field>

  <mat-form-field appearance="fill" subscriptSizing="dynamic">
    <mat-label>{{ 'photoUpload.challenge' | translate }}</mat-label>
    <mat-select data-testid="photo-card-challenge-select" [formField]="editForm.challengeId">
      <mat-option [value]="null">{{ 'photoUpload.noChallenge' | translate }}</mat-option>
      @for (challenge of challenges; track challenge.id) {
        <mat-option
          [value]="challenge.id"
          [attr.data-testid]="'challenge-option-' + challenge.title"
        >
          {{ challenge.title }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-stroked-button
    type="button"
    data-testid="photo-card-cancel-button"
    (click)="cancel()"
  >
    {{ 'photoCard.cancel' | translate }}
  </button>
  <button
    mat-flat-button
    type="button"
    data-testid="photo-card-save-button"
    [disabled]="!editForm().valid()"
    (click)="save()"
  >
    {{ 'photoCard.save' | translate }}
  </button>
</mat-dialog-actions>
