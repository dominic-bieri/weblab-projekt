<div class="calendar-header">
  <button
    mat-icon-button
    type="button"
    data-testid="calendar-prev-month"
    (click)="previousMonth.emit()"
  >
    <mat-icon>chevron_left</mat-icon>
  </button>
  <span class="calendar-header__label" data-testid="calendar-month-label">{{ monthLabel() }}</span>
  <div class="calendar-header__end">
    <button
      mat-icon-button
      type="button"
      data-testid="calendar-today"
      [attr.aria-label]="'calendar.today' | translate"
      (click)="today.emit()"
    >
      <mat-icon>today</mat-icon>
    </button>
    <button
      mat-icon-button
      type="button"
      data-testid="calendar-next-month"
      (click)="nextMonth.emit()"
    >
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</div>

<div class="calendar-grid">
  @for (weekday of weekdayLabels(); track weekday) {
    <span class="weekday">{{ weekday }}</span>
  }
  @for (blank of leadingBlanks(); track $index) {
    <span></span>
  }
  @for (day of days(); track day.date.getTime()) {
    <button
      type="button"
      class="day"
      [class.filled]="day.hasPhoto"
      [class.streak]="day.isStreak"
      [class.today]="day.isToday"
      [class.selected]="isSelected(day.date)"
      [disabled]="!day.hasPhoto"
      [attr.data-testid]="day.hasPhoto ? 'calendar-day-filled' : 'calendar-day-empty'"
      (click)="onDayClick(day)"
    >
      {{ day.date.getDate() }}
    </button>
  }
</div>
