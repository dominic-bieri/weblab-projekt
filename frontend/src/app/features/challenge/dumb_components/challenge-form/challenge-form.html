<mat-card class="form-card">
  <div class="form-card__header">
    <mat-icon aria-hidden="true">flag</mat-icon>
    <h2>{{ 'challenge.formTitle' | translate }}</h2>
  </div>

  <form class="challenge-form" (submit)="submitForm($event)">
    <mat-form-field appearance="fill" subscriptSizing="dynamic">
      <mat-label>{{ 'challenge.title' | translate }}</mat-label>
      <input
        matInput
        type="text"
        data-testid="challenge-title-input"
        [formField]="challengeForm.title"
      />
      <mat-hint align="end"
        >{{ challengeForm.title().value().length }} / {{ titleMaxLength }}</mat-hint
      >
    </mat-form-field>

    <div class="date-row">
      <mat-form-field appearance="fill" subscriptSizing="dynamic">
        <mat-label>{{ 'challenge.startDate' | translate }}</mat-label>
        <input
          matInput
          data-testid="challenge-start-date-input"
          [matDatepicker]="startPicker"
          [formField]="challengeForm.startDate"
        />
        <mat-datepicker-toggle matIconSuffix [for]="startPicker" />
        <mat-datepicker #startPicker />
      </mat-form-field>

      <mat-form-field appearance="fill" subscriptSizing="dynamic">
        <mat-label>{{ 'challenge.endDate' | translate }}</mat-label>
        <input
          matInput
          data-testid="challenge-end-date-input"
          [matDatepicker]="endPicker"
          [formField]="challengeForm.endDate"
        />
        <mat-datepicker-toggle matIconSuffix [for]="endPicker" />
        <mat-datepicker #endPicker />
      </mat-form-field>
    </div>

    <mat-form-field appearance="fill" subscriptSizing="dynamic">
      <mat-label>{{ 'challenge.description' | translate }}</mat-label>
      <input
        matInput
        type="text"
        data-testid="challenge-description-input"
        [formField]="challengeForm.description"
      />
    </mat-form-field>

    <button
      mat-flat-button
      type="submit"
      class="submit-button"
      data-testid="create-challenge-button"
      [disabled]="!challengeForm().valid()"
    >
      {{ 'challenge.create' | translate }}
    </button>
  </form>
</mat-card>
