<mat-card data-testid="challenge-card">
  <mat-card-title data-testid="challenge-card-title">{{ title() }}</mat-card-title>
  <mat-card-content>
    <p data-testid="challenge-card-period">{{ formattedPeriod() }}</p>
    <app-challenge-progress
      [startDate]="startDate()"
      [endDate]="endDate()"
      [captureDates]="captureDates()"
    />
    <p data-testid="challenge-card-description">{{ description() }}</p>
  </mat-card-content>
  <div class="card-actions">
    <a
      mat-stroked-button
      [routerLink]="['/challenge', id()]"
      data-testid="challenge-card-view-photos-link"
    >
      <mat-icon>photo_library</mat-icon>
      {{ 'challenge.viewPhotos' | translate }}
    </a>
    <button
      mat-stroked-button
      type="button"
      data-testid="challenge-card-edit-button"
      (click)="startEdit()"
    >
      <mat-icon>edit</mat-icon>
      {{ 'challenge.edit' | translate }}
    </button>
    <button
      mat-stroked-button
      type="button"
      data-testid="challenge-card-delete-button"
      (click)="onDelete()"
    >
      <mat-icon>delete</mat-icon>
      {{ 'challenge.delete' | translate }}
    </button>
  </div>
</mat-card>
