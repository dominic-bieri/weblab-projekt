<nav>
  @if (authenticated()) {
    @for (linkItem of links(); track linkItem.path) {
      <a
        mat-button
        [routerLink]="linkItem.path"
        routerLinkActive="active"
        [attr.data-testid]="'nav-link-' + linkItem.path"
      >
        {{ linkItem.label | translate }}
      </a>
    }
  }

  <app-language-switcher class="lang-switcher" />

  @if (authenticated()) {
    <button mat-button data-testid="logout-button" (click)="logout()">
      {{ 'nav.logout' | translate }}
    </button>
  }
</nav>
